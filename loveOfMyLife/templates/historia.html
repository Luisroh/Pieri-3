<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 💜</title>
    <style>
        /* Paleta de colores Púrpura */
        :root {
            --purple-dark: #4a148c;
            --purple-main: #6a1b9a;
            --purple-light: #9c27b0;
            --lilac: #e1bee7;
            --bg-color: #f3e5f5;
            --text-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--lilac) 100%);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 500px;
            /* Un poco más ancho para el vídeo */
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(106, 27, 154, 0.3);
            overflow: hidden;
            text-align: center;
            transition: opacity 0.6s ease-in-out, transform 0.6s ease;
            position: relative;
            margin: 20px;
        }

        .image-container {
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container img,
        .image-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Ajusta la imagen sin deformarla */
        }

        .content {
            padding: 25px;
        }

        h1 {
            color: var(--purple-dark);
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-family: 'Arial', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-color);
            line-height: 1.7;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--purple-main);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(106, 27, 154, 0.4);
        }

        button:hover {
            background-color: var(--purple-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(106, 27, 154, 0.6);
        }

        /* Estilos para la pregunta final */
        .final-question {
            padding: 20px;
        }

        .final-question h1 {
            font-size: 1.8rem;
            color: var(--purple-dark);
            margin-bottom: 30px;
        }

        .final-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            height: 100px;
            /* Espacio para el botón que se mueve */
        }

        .btn-si {
            background-color: var(--purple-main);
            font-size: 1.5rem;
            padding: 20px 50px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(106, 27, 154, 0.5);
            z-index: 10;
        }

        .btn-no {
            background-color: #ccc;
            color: #666;
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 20px;
            position: absolute;
            right: 10px;
            bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
            box-shadow: none;
        }

        /* Animación de latido para el botón Sí */
        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.05);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(1);
            }
        }

        .btn-si {
            animation: heartbeat 1.5s infinite;
        }

        /* Estilos para el layout de la foto final */
        .final-photos {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .final-photos img {
            width: 45%;
            border-radius: 15px;
            border: 3px solid var(--lilac);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card" id="storyCard">
        <div id="story-content">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <!-- Datos de Django a JavaScript -->
    {{ historia|json_script:"historia-data" }}

    <script>
        const historiaData = JSON.parse(document.getElementById('historia-data').textContent);
        let currentIndex = 0;

        const contentDiv = document.getElementById('story-content');
        const card = document.getElementById('storyCard');

        function renderStep(index) {
            // Efecto de desvanecimiento
            card.style.opacity = 0;
            card.style.transform = 'scale(0.98)';

            setTimeout(() => {
                const step = historiaData[index];
                let html = '';

                if (step.tipo === 'final') {
                    // --- LÓGICA DE LA PREGUNTA FINAL ---
                    html = `
                        <div class="content final-question">
                            <div class="final-photos">
                                <img src="/static/images/${step.archivo}" alt="Yo 1">
                                <img src="/static/images/${step.archivo2}" alt="Yo 2">
                            </div>
                            <h1>${step.titulo}</h1>
                            <p>${step.texto}</p>
                            <div class="final-buttons">
                                <button class="btn-si" onclick="alert('¡SABÍA QUE DIRÍAS QUE SÍ! 💜 Te amo.')">SÍ</button>
                                <button class="btn-no" id="btnNo" onmouseover="moveNo()" onclick="moveNo()">No</button>
                            </div>
                        </div>
                    `;
                } else {
                    // --- LÓGICA DE IMÁGENES Y VÍDEO ---
                    let mediaHtml = '';
                    if (step.tipo === 'video') {
                        mediaHtml = `
                            <div class="image-container">
                                <video controls autoplay loop muted>
                                    <source src="/static/images/${step.archivo}" type="video/mp4">
                                    Tu navegador no soporta vídeo.
                                </video>
                            </div>
                        `;
                    } else {
                        mediaHtml = `
                            <div class="image-container">
                                <img src="/static/images/${step.archivo}" alt="${step.titulo}">
                            </div>
                        `;
                    }

                    html = `
                        ${mediaHtml}
                        <div class="content">
                            <h1>${step.titulo}</h1>
                            <p>${step.texto}</p>
                            <button onclick="nextStep()">Siguiente</button>
                        </div>
                    `;
                }

                contentDiv.innerHTML = html;
                card.style.opacity = 1;
                card.style.transform = 'scale(1)';
            }, 600);
        }

        function nextStep() {
            if (currentIndex < historiaData.length - 1) {
                currentIndex++;
                renderStep(currentIndex);
            }
        }

        // Función para que el botón "No" se mueva y sea difícil de pulsar
        function moveNo() {
            const btnNo = document.getElementById('btnNo');
            if (btnNo) {
                // Movemos el botón aleatoriamente dentro del contenedor de botones
                const container = btnNo.parentElement;
                const containerRect = container.getBoundingClientRect();
                const btnRect = btnNo.getBoundingClientRect();

                // Calculamos una nueva posición aleatoria
                // Restamos el tamaño del botón para que no se salga
                const maxLeft = containerRect.width - btnRect.width;
                const maxTop = containerRect.height - btnRect.height;

                const randomLeft = Math.random() * maxLeft;
                const randomTop = Math.random() * maxTop;

                // Aplicamos la posición relativa al contenedor
                // Nota: Como el botón está en absolute, necesitamos ajustar
                // Para simplificar, usamos transform
                const randomX = (Math.random() - 0.5) * 100; // -50 a 50 px
                const randomY = (Math.random() - 0.5) * 100; // -50 a 50 px

                btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
                btnNo.style.transition = 'transform 0.1s ease';
            }
        }

        // Iniciar
        renderStep(0);
    </script>
</body>

</html>
